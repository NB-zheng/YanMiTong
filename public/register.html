<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 研密通</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-brand-title">研密通</div>
            <div class="auth-brand-subtitle">创建你的账号</div>
        </div>

        <form id="register-form">
            <div class="form-group">
                <label class="form-label" for="username">用户名</label>
                <input class="input" type="text" id="username" name="username" required minlength="2" maxlength="50" autocomplete="username" autofocus>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">密码</label>
                <input class="input" type="password" id="password" name="password" required minlength="6" maxlength="64" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label class="form-label" for="password2">确认密码</label>
                <input class="input" type="password" id="password2" name="password2" required minlength="6" maxlength="64" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label class="form-label" for="organization">所属单位 <span class="text-muted text-sm">（可选）</span></label>
                <input class="input" type="text" id="organization" name="organization" maxlength="100">
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submit-btn">注 册</button>
        </form>

        <div class="auth-footer">
            已有账号？<a href="/login.html">立即登录</a>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        if (getToken()) {
            window.location.href = '/';
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;
            const organization = document.getElementById('organization').value.trim() || null;
            if (password !== password2) {
                toast('两次输入的密码不一致', 'error');
                return;
            }
            btn.disabled = true;
            btn.textContent = '注册中…';
            try {
                await apiPost('/auth/register', { username, password, organization });
                toast('注册成功，正在自动登录…', 'success');
                const data = await apiPost('/auth/login', { username, password });
                saveSession(data);
                setTimeout(() => window.location.href = '/', 400);
            } catch (err) {
                toast(err.message || '注册失败', 'error');
                btn.disabled = false;
                btn.textContent = '注 册';
            }
        });
    </script>
</body>
</html>
